[platformio]
default_envs = probe_cli_compile
src_dir = examples/probe_cli
build_dir = .build/platformio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/pio_firmware.py
lib_deps = MotorControl-CAN=symlink://.
build_src_filter = +<main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; N8 / no-PSRAM build fixture only. CAN remains disabled even if flashed.
[env:probe_cli_compile]
build_flags = ${env.build_flags} -DMOTORCONTROLCAN_COMPILE_FIXTURE=1

; Supply all MOTORCONTROLCAN_CAN_* definitions explicitly for the actual fixture.
; FirmwareBoard.h rejects missing facts, SDK-invalid pins and the S3 USB console GPIO19/20.
[env:probe_cli]
build_flags = ${env.build_flags} -DMOTORCONTROLCAN_COMPILE_FIXTURE=0

; ESP32-S2 (4 MB embedded flash, DIO) compile fixture. BLOCKED with the pinned
; pioarduino 55.03.311 package: its prebuilt esp32s2 libraries enable the UART0
; console (CONFIG_ESP_CONSOLE_UART), so EspProbePlatform's exclusive-UART0 guard fails.
; This environment reproduces that blocker; it is not a passing build or parity claim.
; See docs/firmware_examples.md. The shared S2 image is built with ESP-IDF instead.
[env:probe_cli_s2_compile]
board = esp32-s2-saola-1
board_build.flash_mode = dio
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMOTORCONTROLCAN_COMPILE_FIXTURE=1

; Explicit S2 board: supply every MOTORCONTROLCAN_CAN_* definition for the actual
; fixture, including the silent pin and its level if one exists. Same blocker as above.
[env:probe_cli_s2]
board = esp32-s2-saola-1
board_build.flash_mode = dio
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMOTORCONTROLCAN_COMPILE_FIXTURE=0
