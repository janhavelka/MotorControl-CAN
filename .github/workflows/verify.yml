name: Verify core and compile-only firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  windows:
    name: Quick GCC on Windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/verify.py --mode quick --compiler gcc --build-dir .build/verification
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-windows
          path: |
            .build/verification/**/*.log
            .build/verification/**/*.json
          include-hidden-files: true
  native:
    name: Full ${{ matrix.compiler }} with ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build pinned Doxygen 1.13.2
        shell: bash
        run: |
          git init .build/doxygen-tool/source
          git -C .build/doxygen-tool/source remote add origin https://github.com/doxygen/doxygen.git
          git -C .build/doxygen-tool/source fetch --depth 1 origin 26342b775ea25e6fefb53220926b20702c56fcb3
          git -C .build/doxygen-tool/source checkout --detach FETCH_HEAD
          test "$(git -C .build/doxygen-tool/source rev-parse HEAD)" = 26342b775ea25e6fefb53220926b20702c56fcb3
          cmake -S .build/doxygen-tool/source -B .build/doxygen-tool/build -G Ninja -DCMAKE_BUILD_TYPE=Release -Dbuild_doc=OFF -Dbuild_wizard=OFF
          cmake --build .build/doxygen-tool/build --target doxygen --parallel 2
          echo "$PWD/.build/doxygen-tool/build/bin" >> "$GITHUB_PATH"
      - name: Full verification
        run: python scripts/verify.py --mode full --compiler ${{ matrix.compiler }} --sanitize --build-dir .build/verification
      - name: Retain verification and documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.compiler }}
          path: |
            .build/verification/**/*.log
            .build/verification/**/*.json
            .build/verification/**/*.zip
            .build/doxygen/html
            .build/doxygen/xml
          include-hidden-files: true
          if-no-files-found: warn
  arduino:
    name: Arduino 3.3.11 compile fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned PlatformIO and resolved Arduino framework
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install -e probe_cli_compile
      - name: Compile and inspect actual shared inputs
        run: python scripts/check_firmware.py --target arduino --build-dir .build/firmware
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-arduino
          path: |
            .build/firmware/**/*.log
            .build/firmware/**/*.json
            .build/firmware/**/*.elf
            .build/firmware/**/*.bin
          include-hidden-files: true
          if-no-files-found: warn
  idf:
    name: ESP-IDF 5.5.5 firmware and isolated component
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      IDF_TOOLS_PATH: ${{ github.workspace }}/.build/idf-tools
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install reviewed ESP-IDF revision and its pinned toolchain
        shell: bash
        run: |
          git init .build/esp-idf
          git -C .build/esp-idf remote add origin https://github.com/espressif/esp-idf.git
          git -C .build/esp-idf fetch --depth 1 origin b774170ff46c393eeb5e495ea37936038d3f4f4f
          git -C .build/esp-idf checkout --detach FETCH_HEAD
          test "$(git -C .build/esp-idf rev-parse HEAD)" = b774170ff46c393eeb5e495ea37936038d3f4f4f
          git -C .build/esp-idf submodule update --init --recursive --depth 1
          .build/esp-idf/install.sh esp32s2 esp32s3
      - name: Build standalone firmware and separate portable component
        shell: bash
        run: |
          . .build/esp-idf/export.sh
          python scripts/check_firmware.py --target idf --build-dir .build/firmware-idf
          python scripts/check_firmware.py --target idf-s2 --build-dir .build/firmware-idf-s2
          python scripts/check_firmware.py --target idf-s2-optak --build-dir .build/firmware-idf-s2-optak
          python scripts/check_firmware.py --target s2 --build-dir .build/firmware-s2
          python scripts/check_firmware.py --target component --build-dir .build/firmware-component
      - name: Measure stack frames and call chains with the same compiler options
        shell: bash
        run: |
          . .build/esp-idf/export.sh
          s3=(.build/firmware-idf/*/idf/compile_commands.json)
          s2=(.build/firmware-s2/*/s2/compile_commands.json)
          python scripts/check_stack.py --require-toolchain --build-dir .build/stack --report .build/stack/report.json --strict --compile-commands "esp32s3=${s3[0]}" --compile-commands "esp32s2=${s2[0]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-idf
          path: |
            .build/firmware-idf/**/*.log
            .build/firmware-idf/**/*.json
            .build/firmware-idf/**/*.elf
            .build/firmware-idf/**/*.bin
            .build/firmware-idf-s2/**/*.log
            .build/firmware-idf-s2/**/*.json
            .build/firmware-idf-s2/**/*.elf
            .build/firmware-idf-s2/**/*.bin
            .build/firmware-idf-s2-optak/**/*.log
            .build/firmware-idf-s2-optak/**/*.json
            .build/firmware-idf-s2-optak/**/*.elf
            .build/firmware-idf-s2-optak/**/*.bin
            .build/firmware-s2/**/*.log
            .build/firmware-s2/**/*.json
            .build/firmware-s2/**/*.elf
            .build/firmware-s2/**/*.bin
            .build/firmware-component/**/*.log
            .build/firmware-component/**/*.json
            .build/firmware-component/**/*.elf
            .build/firmware-component/**/*.bin
            .build/stack/report.json
            .build/stack/**/*.su
            .build/stack/**/*.ci
            .build/stack/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
